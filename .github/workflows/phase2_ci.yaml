name: Phase 2 AI Smoke Test Pipeline

on:
  push:
    branches: 
      - "main"
      - "master"
      - "phase-2*"  
  pull_request:
    branches: [ "main", "master", "phase-2*" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        run: |
          docker buildx build \
            --tag phase2-image:latest \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            .

      - name: Smoke Training Test (Real Run)
        run: |
          docker run --rm phase2-image:latest \
            yolo train model=configs/custom_yolov8.yaml \
            data=configs/kitti.yaml \
            epochs=1 \
            imgsz=32 \
            batch=2 \
            project=runs/smoke_test \
            name=smoke_run \
            device=cpu

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache