name: Phase 1 Docker CI

on:
  push:
    branches: [ phase-1 ]
  pull_request:
    branches: [ phase-1 ]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker Image
      run: docker build -t ai-project .
    - name: Run Tests (Smoke Test)
      run: docker run --rm ai-project echo "Smoke Test Passed"
