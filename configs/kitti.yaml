# configs/kitti.yaml

# مسیر اصلی دیتاست داخل داکر
path: /app/data/kitti  

train: images/train
val: images/val
test: images/test  # (اختیاری)

# تعداد کل کلاس‌ها
nc: 8

# اسم دقیق کلاس‌ها (طبق فایلی که دادی)
names:
  0: car
  1: van
  2: truck
  3: pedestrian
  4: person_sitting
  5: cyclist
  6: tram
  7: misc